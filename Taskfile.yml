version: '3'

vars:
  # Example: task run -- CLI_ARGS="build -v -o out path/to/input"
  CLI_ARGS: ''

tasks:
  mocks:
    desc: Regenerate mocks from .mockery.yaml (mockery)
    cmds:
      - go run github.com/vektra/mockery/v2@v2.53.8

  run:
    desc: Run the main program (set CLI_ARGS for flags and the input file)
    silent: true
    cmds:
      # go run prints an extra "exit status 1" line on failure; build + exec avoids it.
      - mkdir -p bin && go build -o bin/zam ./cmd/
      - cmd: ./bin/zam {{.CLI_ARGS}}
        ignore_error: true

  build:
    desc: Build the Zam binary
    cmds:
      - go build -o zam cmd/main.go

  test:
    desc: Run all tests and print per-function coverage
    cmds:
      - go test ./... -count=1 -cover -coverprofile=coverage.out
      - go tool cover -func=coverage.out

  test:native-report:
    desc: Run the end-to-end tests against the native backend and summarize what passes (report only)
    cmds:
      - cmd: ZAM_TEST_NATIVE=1 go test ./internal/5_build -count=1 -timeout 20m -json > native-report.json
        ignore_error: true
      - go run ./internal/5_build/nativereport < native-report.json

  linux:image:
    desc: Build the Linux image zam is built and tested in (set ZIG_SHA256 to the Zig tarball's checksum on other than arm64)
    cmds:
      - docker build --build-arg ZIG_SHA256={{.ZIG_SHA256}} -t zam-linux docker

  test:linux:
    desc: Run all tests in the Linux image
    cmds:
      - docker run --rm -v "$PWD":/src -v zam-linux-cache:/root/.cache zam-linux go test ./... -count=1 --race

  packs:
    desc: Build target packs into bin/packs in the Linux image (set TARGETS; add --runtime-only to rebuild only the runtime)
    vars:
      TARGETS: '{{.TARGETS | default "x86_64-linux-musl aarch64-linux-musl x86_64-macos aarch64-macos x86_64-windows-gnu aarch64-windows-gnu"}}'
    cmds:
      - docker run --rm -v "$PWD":/src -v zam-linux-cache:/root/.cache zam-linux docker/pack.sh {{.TARGETS}} {{.CLI_ARGS}}

  test:windows:
    desc: Run the end-to-end tests natively for Windows under Wine in the Linux image and summarize what passes (report only; set TARGET for another Windows target)
    vars:
      TARGET: '{{.TARGET | default "aarch64-windows-gnu"}}'
    cmds:
      - cmd: docker run --rm -v "$PWD":/src -v zam-linux-cache:/root/.cache -e ZAM_TEST_TARGET={{.TARGET}} zam-linux go test ./internal/5_build -count=1 -timeout 20m -json > windows-report.json
        ignore_error: true
      - go run ./internal/5_build/nativereport < windows-report.json

  test:cross:
    desc: Cross-build a hello world and an HTTPS fetch for Linux on this machine and run them in Debian (arm64) and Alpine (amd64) containers (needs the network; set URL to fetch another)
    vars:
      URL: '{{.URL | default "https://example.com"}}'
    cmds:
      - mkdir -p bin/cross && go build -o bin/zam ./cmd/
      - |
        for target in aarch64-linux-musl x86_64-linux-musl; do
          ZAM_PACKS="$PWD/bin/packs" bin/zam build --native --target $target -o bin/cross/hello-$target docs/0_example/helloworld/Main.zam
          ZAM_PACKS="$PWD/bin/packs" bin/zam build --native --target $target -o bin/cross/https-$target docker/cross/https/Main.zam
        done
      - docker run --rm --platform linux/arm64 -v "$PWD/bin/cross":/cross zam-linux sh -c '/cross/hello-aarch64-linux-musl && /cross/https-aarch64-linux-musl {{.URL}}'
      - docker run --rm --platform linux/amd64 -v "$PWD/bin/cross":/cross alpine:3 sh -c '/cross/hello-x86_64-linux-musl && /cross/https-x86_64-linux-musl {{.URL}}'

  vscode:
    desc: Build and package the editor extension, and install it into VS Code and Cursor where present
    dir: editors/vscode
    cmds:
      - npm install
      - npm run compile
      - npm run package
      - |
        status=0
        for editor in code cursor; do
          if command -v $editor >/dev/null; then
            $editor --install-extension zam.vsix --force || status=1
          fi
        done
        exit $status

  runtime:
    desc: Build the C runtime
    cmds:
      - make -C internal/5_build/runtime

  runtime:clean:
    cmds:
      - make -C internal/5_build/runtime clean

  runtime:run:
    desc: Run an image through the C runtime (set CLI_ARGS to the image path)
    silent: true
    cmds:
      - make -C internal/5_build/runtime
      - cmd: ./internal/5_build/runtime/bin/zam {{.CLI_ARGS}}
        ignore_error: true

  hashes:
    desc: "Fetch Homebrew and Scoop SHA256 hashes for a release (usage: task hashes VERSION=v0.1.0)"
    cmds:
      - |
        if [ -z "{{.VERSION}}" ]; then
          echo "Error: Please provide a version. Example: task hashes VERSION=v0.1.0"
          exit 1
        fi
        echo "=== Homebrew Source Tarball Hash ({{.VERSION}}) ==="
        curl -sL https://github.com/Zambozoo/zam/archive/refs/tags/{{.VERSION}}.tar.gz | shasum -a 256
        
        echo -e "\n=== Scoop Windows AMD64 Zip Hash ({{.VERSION}}) ==="
        curl -sL https://github.com/Zambozoo/zam/releases/download/{{.VERSION}}/zam-{{.VERSION}}-windows-amd64.zip | shasum -a 256
        
        echo -e "\n=== Scoop Windows ARM64 Zip Hash ({{.VERSION}}) ==="
        curl -sL https://github.com/Zambozoo/zam/releases/download/{{.VERSION}}/zam-{{.VERSION}}-windows-arm64.zip | shasum -a 256