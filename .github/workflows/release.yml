name: Release

# Builds zam for each platform with LLVM linked in statically, and the target
# packs, and publishes them for a version tag. Run by hand, it builds without
# publishing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIG_VERSION: 0.17.1

jobs:
  llvm:
    uses: ./.github/workflows/llvm.yml

  zam:
    needs: llvm
    strategy:
      matrix:
        include:
          - { runner: macos-15, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: ubuntu-24.04, platform: linux-amd64 }
          - { runner: windows-latest, platform: windows-amd64, target: x86_64-windows-gnu }
          - { runner: windows-11-arm, platform: windows-arm64, target: aarch64-windows-gnu }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      ZAM_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - if: runner.os != 'macOS'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/download-artifact@v7
        with:
          name: llvm-${{ matrix.platform }}

      - run: tar -xzf llvm.tar.gz

      - run: ZAM_VERSION="${GITHUB_REF_NAME//\//-}" release/zam.sh "$PWD/llvm" "dist/zam${{ runner.os == 'Windows' && '.exe' || '' }}"

      # Windows takes a zip, as scoop installs it.
      - if: runner.os != 'Windows'
        run: tar -czf "zam-${GITHUB_REF_NAME//\//-}-${{ matrix.platform }}.tar.gz" -C dist zam

      - if: runner.os == 'Windows'
        run: cd dist && 7z a "../zam-${GITHUB_REF_NAME//\//-}-${{ matrix.platform }}.zip" zam.exe

      - uses: actions/upload-artifact@v6
        with:
          name: zam-${{ matrix.platform }}
          path: zam-*-${{ matrix.platform }}.*

  packs:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - run: docker build -t zam-linux docker

      - run: docker run --rm -v "$PWD":/src zam-linux docker/pack.sh x86_64-linux-musl aarch64-linux-musl x86_64-macos aarch64-macos x86_64-windows-gnu aarch64-windows-gnu

      - run: release/packs.sh "${GITHUB_REF_NAME//\//-}" dist

      - uses: actions/upload-artifact@v6
        with:
          name: packs
          path: dist/*

  release:
    needs: [zam, packs]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - run: cd dist && sha256sum zam-* > checksums.txt

      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file dist/notes.md dist/zam-* dist/checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
