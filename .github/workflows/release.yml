name: Release

# Releases main as the version it is given: builds zam for each platform with
# LLVM linked in statically, and the target packs, then tags the commit built
# and publishes them. A version with an -rc.N suffix is a prerelease, which
# the Homebrew tap and the scoop bucket do not follow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, vN.N.N or vN.N.N-rc.N.
        type: string
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}
  ZIG_VERSION: 0.17.1

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - run: |
          if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "version $VERSION is not vN.N.N or vN.N.N-rc.N" >&2
            exit 1
          fi
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "releases are made from main, not $GITHUB_REF" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "$VERSION is already tagged" >&2
            exit 1
          fi

  # The tests leave the LLVM and the packs the release builds with.
  test:
    needs: version
    uses: ./.github/workflows/test.yml

  zam:
    needs: test
    strategy:
      matrix:
        include:
          - { runner: macos-15, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: ubuntu-24.04, platform: linux-amd64 }
          - { runner: windows-latest, platform: windows-amd64, target: x86_64-windows-gnu }
          - { runner: windows-11-arm, platform: windows-arm64, target: aarch64-windows-gnu }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      ZAM_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - if: runner.os != 'macOS'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/download-artifact@v7
        with:
          name: llvm-${{ matrix.platform }}

      - run: tar -xzf llvm.tar.gz

      - run: ZAM_VERSION="$VERSION" release/zam.sh "$PWD/llvm" "dist/zam${{ runner.os == 'Windows' && '.exe' || '' }}"

      # Windows takes a zip, as scoop installs it.
      - if: runner.os != 'Windows'
        run: tar -czf "zam-$VERSION-${{ matrix.platform }}.tar.gz" -C dist zam

      - if: runner.os == 'Windows'
        run: cd dist && 7z a "../zam-$VERSION-${{ matrix.platform }}.zip" zam.exe

      - uses: actions/upload-artifact@v6
        with:
          name: zam-${{ matrix.platform }}
          path: zam-*-${{ matrix.platform }}.*

  packs:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          pattern: test-pack-*
          merge-multiple: true

      - run: mkdir -p bin && for pack in pack-*.tar.gz; do tar -xzf "$pack" -C bin; done

      - run: release/packs.sh "$VERSION" dist

      - uses: actions/upload-artifact@v6
        with:
          name: packs
          path: dist/*

  # Checks each platform's archive with this release's packs, without zig, as
  # a user installs it.
  check:
    needs: [zam, packs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: ubuntu-24.04, platform: linux-amd64 }
          - { runner: windows-latest, platform: windows-amd64 }
          - { runner: windows-11-arm, platform: windows-arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: zam-${{ matrix.platform }}
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: packs
          path: packs

      - run: release/check.sh "$VERSION" dist/zam-"$VERSION"-${{ matrix.platform }}.* packs

  # Tags the commit built as it publishes, so a failed build leaves no tag.
  release:
    needs: [zam, packs, check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - run: cd dist && sha256sum zam-* > checksums.txt

      - run: gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --notes-file dist/notes.md ${{ contains(inputs.version, '-') && '--prerelease' || '' }} dist/zam-* dist/checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}

  # Points the Homebrew tap and the scoop bucket at the release. TAP_TOKEN
  # writes to both repositories, which the workflow's own token cannot.
  publish:
    needs: release
    if: ${{ !contains(inputs.version, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: Zambozoo/homebrew-zam
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - uses: actions/checkout@v5
        with:
          repository: Zambozoo/scoop-zam
          token: ${{ secrets.TAP_TOKEN }}
          path: bucket

      - run: gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - run: release/taps.sh "$VERSION" checksums.txt tap/Formula/zam.rb bucket/bucket/zam.json

      - run: |
          for repo in tap bucket; do
            git -C "$repo" config user.name github-actions[bot]
            git -C "$repo" config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git -C "$repo" commit -am "zam $VERSION"
            git -C "$repo" push
          done
