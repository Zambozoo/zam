name: Test

# Runs the tests on every platform zam is released for, the end-to-end tests
# against both the interpreter and native code, then builds zam as a release
# does and checks the binary itself. Windows runs native code only, as the
# interpreter's build is not ported there, and without the race detector,
# whose runtime needs an import library Zig's mingw lacks.
on:
  push:
    branches:
      - main
      - 'ci/**'
  pull_request:
  workflow_dispatch:

env:
  ZIG_VERSION: 0.17.1
  # VERSION names the zam the binary check builds, and the packs it downloads.
  VERSION: v0.0.0-ci

jobs:
  llvm:
    uses: ./.github/workflows/llvm.yml

  packs:
    uses: ./.github/workflows/packs.yml
    with:
      version: v0.0.0-ci

  # Linux tests in the image zam is developed in, which has LLVM, the C
  # libraries and the compiler both backends need; macOS links the LLVM the
  # release links and takes the interpreter's C libraries from Homebrew.
  test:
    needs: [llvm, packs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: ubuntu-24.04, platform: linux-amd64 }
          - { runner: macos-15, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-amd64 }
          - { runner: windows-latest, platform: windows-amd64, target: x86_64-windows-gnu }
          - { runner: windows-11-arm, platform: windows-arm64, target: aarch64-windows-gnu }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      ZAM_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5

      # The end-to-end tests' binaries need more disk than a Linux runner has
      # free beside toolchains zam does not use.
      - if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/download-artifact@v7
        with:
          pattern: pack-*
          merge-multiple: true

      - run: for pack in pack-*.tar.gz; do tar -xzf "$pack" && rm "$pack"; done

      - uses: actions/download-artifact@v7
        with:
          name: release-packs
          path: release-packs

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/download-artifact@v7
        with:
          name: llvm-${{ matrix.platform }}

      - run: tar -xzf llvm.tar.gz && rm llvm.tar.gz

      - if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v3

      - if: runner.os == 'Linux'
        uses: docker/build-push-action@v6
        with:
          context: docker
          tags: zam-linux
          load: true
          cache-from: type=gha,scope=zam-linux-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=zam-linux-${{ runner.arch }}

      - if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD":/src -v zam-linux-cache:/root/.cache -e ZAM_PACKS=/src/packs zam-linux go test ./... -count=1 -timeout 45m --race
          docker run --rm -v "$PWD":/src -v zam-linux-cache:/root/.cache -e ZAM_PACKS=/src/packs -e ZAM_TEST_NATIVE=1 zam-linux go test ./internal/5_build -count=1 -timeout 45m --race

      - if: runner.os == 'macOS'
        run: brew install pkgconf json-c libyaml libxml2 mongo-c-driver libcbor lz4 zstd brotli openssl@3 curl llhttp libsodium

      - if: runner.os == 'macOS'
        run: |
          source release/cgo.sh "$PWD/llvm"
          export ZAM_PACKS=$PWD/packs PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig"
          go test -tags zam_static ./... -count=1 -timeout 45m --race
          ZAM_TEST_NATIVE=1 go test -tags zam_static ./internal/5_build -count=1 -timeout 45m --race

      - if: runner.os == 'Windows'
        run: |
          source release/cgo.sh "$PWD/llvm"
          export ZAM_PACKS=$(cygpath -m "$PWD/packs") ZAM_TEST_NATIVE=1
          go test -tags zam_static ./... -count=1 -timeout 45m

      # The binary as a release builds it, checked whether or not the tests
      # passed.
      - if: ${{ !cancelled() }}
        run: release/check.sh --all "$VERSION" "$(release/dist.sh "$PWD/llvm" "$VERSION" ${{ matrix.platform }})" release-packs
